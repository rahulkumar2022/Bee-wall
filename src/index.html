<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1c4">
<meta name="description" content="One stroke. Five seconds. Keep the dog safe in Bee Wall, a hand-drawn puzzle game.">
<title>Bee Wall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cpath fill='%23f5b800' stroke='%232a1a3e' stroke-width='3' d='M18 2l14 8v16l-14 8-14-8V10z'/%3E%3Cpath stroke='%232a1a3e' stroke-width='3' stroke-linecap='round' d='M12 15h12m-10 6h8'/%3E%3C/svg%3E">
<!-- SDK -->
<!-- STYLE -->
</head>
<body>
<div id="loading" role="status"><div class="loader-cell" aria-hidden="true"></div><p>Loading Bee Wall…</p></div>
<main id="app" inert aria-label="Bee Wall game">
  <header class="top">
    <div class="brand" aria-label="Bee Wall"><svg viewBox="0 0 42 42" aria-hidden="true"><path class="cell" d="M21 2 37.5 11.5v19L21 40 4.5 30.5v-19z"/><path class="bee-mark" d="M16 19c-9-6-5-13 4-2 7-10 14-3 6 2m-10 6h10m-8 4h6m-3 0v3"/><path class="bee-body" d="M14 20q7-4 14 0-1 11-7 11t-7-11Z"/><path class="bee-mark" d="M15 23h12m-10 4h8"/></svg><h1>Bee <span>Wall</span></h1></div>
    <nav class="tools" aria-label="Game controls">
      <button id="restart" class="icon-btn" type="button" aria-label="Restart level" title="Restart level (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .9 7.2M4 4v6h6"/></svg></button>
      <button id="levels" class="icon-btn" type="button" aria-label="Level select" title="Level select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 4.3 2.5v5L12 12 7.7 9.5v-5ZM6.5 11 11 13.5v5L6.5 21 2 18.5v-5Zm11 0 4.5 2.5v5L17.5 21 13 18.5v-5Z"/></svg></button>
      <button id="settings" class="icon-btn" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h4m4 0h8M4 12h10m4 0h2M4 18h2m4 0h10M8 4v4m10 2v4M6 16v4"/></svg></button>
    </nav>
  </header>
  <div id="arena" class="arena">
    <div id="stage" class="stage" data-phase="draw">
      <canvas id="board" width="360" height="640" role="img" aria-label="Puzzle board. Draw a line to block the bees and protect the dog."></canvas>
      <div id="result" class="result" hidden>
        <span id="stars" class="stars" aria-hidden="true"></span>
        <h2 id="result-title"></h2>
        <p id="result-copy"></p>
        <div class="result-actions">
          <button id="primary" class="honey-btn" type="button"></button>
          <button id="secondary" class="plain-btn" type="button" hidden></button>
        </div>
      </div>
      <div id="fail" class="fail" hidden>
        <div><strong>Uh-oh!</strong><span id="fail-copy">The dog is fine.</span></div>
        <button id="retry" class="honey-btn" type="button">Try again</button>
        <button id="skip" class="plain-btn" type="button" hidden>Skip</button>
      </div>
      <output id="debug" class="debug" hidden></output>
    </div>
  </div>
  <footer class="hud">
    <div class="hud-top"><div class="level-id"><strong id="level-number">01</strong><span id="world-name">Meadow</span></div><span id="clock" class="clock">5.0 s</span></div>
    <div class="meter-row"><span id="meter-label">Ink</span><progress id="meter" value="100" max="100" aria-labelledby="meter-label"></progress><span id="meter-readout">100%</span></div>
    <span id="status" class="sr-only" aria-live="polite" aria-atomic="true"></span>
  </footer>
</main>
<div class="scrim" id="scrim" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head"><h2 id="sheet-title"></h2><button id="close" class="icon-btn" type="button" aria-label="Close panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div id="sheet-body" class="sheet-body"></div>
  </section>
</div>
<template id="settings-template">
  <div class="setting-list">
    <label class="setting">Sound effects<input type="checkbox" data-setting="sfx"><span aria-hidden="true"></span></label>
    <label class="setting">Music<input type="checkbox" data-setting="music"><span aria-hidden="true"></span></label>
    <label class="setting">Haptics<input type="checkbox" data-setting="haptics"><span aria-hidden="true"></span></label>
    <label class="setting">Assist mode<input type="checkbox" data-setting="assist"><span aria-hidden="true"></span></label>
    <label class="setting">Auto-retry<input type="checkbox" data-setting="autoRetry"><span aria-hidden="true"></span></label>
    <label class="setting">Appearance<select data-setting="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </div>
  <p class="setting-note">Assist adds 50% ink and slows the swarm. It takes effect on the next attempt.</p>
  <p class="save-note" hidden></p>
  <button id="reset-progress" class="plain-btn reset" type="button">Reset progress</button>
</template>
<!-- GAME -->
</body>
</html>
